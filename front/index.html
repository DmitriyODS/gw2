<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- У приложения есть собственная тёмная тема: просим Dark Reader и
         подобные расширения не перекрашивать страницу — их эвристики ломают
         oklch-переменные (прозрачные модалки, белые панели). -->
    <meta name="darkreader-lock" />

    <!-- Загрузчик шрифтов и счётчика Яндекс.Метрики (id 110869595) — внешним
         файлом, а не инлайном: CSP страницы запрещает встроенные скрипты. -->
    <script src="/boot/head.js" defer></script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- PWA: устанавливаемое приложение (Chrome предлагает «Установить»). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e8590c" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Groove Work" />
    <title>Groove Work</title>

    <!-- SEO: как платформу видят Яндекс и Google в выдаче. -->
    <meta
      name="description"
      content="Groove Work — личный менеджер дел: задачи и учёт времени, ежедневник и напоминания, заметки, доски и файлы на диске, переписка и звонки. Всё в одном месте — и на компьютере, и в телефоне. Появится команда — платформа вырастет вместе с вами."
    />
    <meta
      name="keywords"
      content="менеджер дел, планировщик задач, список дел, учёт времени, тайм-трекинг, ежедневник, напоминания, заметки, облачный диск, мессенджер, видеозвонки, ИИ-ассистент, groove work"
    />
    <meta name="application-name" content="Groove Work" />
    <meta name="author" content="Groove Work" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gw.kodass.ru/" />

    <!-- Open Graph (Яндекс/Google/соцсети) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Groove Work" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Groove Work 8 — ваш timeline в удобном интерфейсе" />
    <meta
      property="og:description"
      content="Дела и время, ежедневник и напоминания, заметки, диск, переписка и звонки — всё в одном месте, на всех ваших устройствах."
    />
    <meta property="og:url" content="https://gw.kodass.ru/" />
    <meta property="og:image" content="https://gw.kodass.ru/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Groove Work 8 — ваш timeline в удобном интерфейсе" />
    <meta
      name="twitter:description"
      content="Дела и время, ежедневник, заметки, диск, переписка и звонки — личный менеджер дел, который растёт вместе с командой."
    />
    <meta name="twitter:image" content="https://gw.kodass.ru/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Yandex.Metrika: пиксель для браузеров без JS -->
    <noscript><div><img src="https://mc.yandex.ru/watch/110869595" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <div id="app"></div>
    <!-- Бут-watchdog: ES5, классический скрипт — выполнится в любом WebView
         и до бандла (см. сам файл). -->
    <script src="/boot/watchdog.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
