# Заголовки безопасности приложения. Подключается в server И в каждый
# location со своим add_header: nginx наследует add_header с уровня выше,
# только если на текущем уровне нет ни одного своего — иначе заголовки
# молча пропадают ровно на этих ответах (index.html, ассеты, /apps/).
# always — заголовки нужны и на ответах с ошибкой.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Защита от кликджекинга для браузеров без CSP frame-ancestors.
add_header X-Frame-Options "SAMEORIGIN" always;
# Камера, микрофон и показ экрана — только самому приложению (звонки).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

# CSP пока в режиме Report-Only: нарушения видны в консоли браузера, но
# ничего не блокируется. Включать (убрать -Report-Only) после проверки
# десктопа, телефона, обёрток, звонка, загрузки файлов и Метрики.
#  - скрипты: только бандл и загрузчики /boot/, без инлайна; путь, а не весь
#    'self' — иначе загруженный в /uploads/ .js годился бы как «свой» скрипт;
#  - стили: инлайн нужен Vue (:style) и PrimeVue;
#  - картинки: https — Markdown портала и заметок показывает внешние картинки;
#  - Метрика с Вебвизором: mc.yandex.*, yastatic.net, mc.webvisor.*.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src $csp_script_src https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' $csp_ws_src https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://mc.webvisor.org https://mc.webvisor.com; worker-src 'self' blob:; frame-src 'self' blob: https://mc.yandex.ru https://mc.yandex.com; child-src 'self' blob: https://mc.yandex.ru https://mc.yandex.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# HSTS: браузер ходит только по HTTPS. На http-стенде (dev) заголовок
# браузеры игнорируют по спецификации.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
