# Файлы пользователей отдаются с НАШЕГО домена, поэтому загруженные HTML, SVG
# или XML, открытые напрямую, исполнялись бы как страница приложения (хранимый
# XSS). Для таких типов — песочница без скриптов: документ получает
# уникальный origin и ничего не может сделать от имени пользователя. Картинки
# в <img> CSP ответа не касается — SVG в ленте показывается как прежде.
# $uploads_csp задаёт map в http-контексте конфига (пусто — заголовка нет).
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy $uploads_csp always;
add_header Cache-Control "public, max-age=31536000, immutable";
