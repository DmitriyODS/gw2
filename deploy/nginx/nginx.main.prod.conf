# Основной конфиг прод-nginx: стандартный из образа плюс блок stream.
# Сайт — conf.d/default.conf (nginx.prod.conf).
#
# Порт 443 делят сайт и TURN LiveKit: в корпоративных сетях и мобильных VPN
# часто открыт только он, а TURN на 5349 туда не пробивался. Развод — по имени
# из TLS-рукопожатия (SNI), без расшифровки: turn.<домен> уходит в LiveKit,
# который сам терминирует TLS своим сертификатом, всё остальное — сайту.
# Адрес клиента обе стороны получают PROXY-протоколом: без него сайт видел бы
# 127.0.0.1 (ломались бы щит от перебора паролей, лимит регистраций и карточки
# входов), а TURN сообщал бы клиенту адрес nginx.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    map $ssl_preread_server_name $tls_backend {
        turn.gw.kodass.ru  livekit_turn;
        default            web_https;
    }

    upstream livekit_turn { server livekit:443; }
    upstream web_https    { server 127.0.0.1:8443; }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_protocol on;
        # TURN-сессия живёт весь звонок, веб-сокеты — часами; простой
        # по умолчанию (10 мин) рвал бы тихие соединения.
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
