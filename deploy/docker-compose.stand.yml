# ================================================================
# Локальный испытательный стенд: весь стек в Docker (как `make dev-stack`),
# но отдельным проектом compose (`gw2stand` — свои тома и сеть) и без
# проброса базы и Redis на хост. Нужен, когда 5432/6379/8080 заняты другими
# проектами машины. Подключается третьим файлом поверх dev-оверлея:
#   make stand        — собрать и поднять (фронт http://localhost:18080)
#   make stand-stop   — остановить
# ================================================================
services:
  db:
    ports: !reset []
  redis:
    ports: !reset []
  nginx:
    ports: !override
      - "18080:80"
