# Dev-стек Groove Work v4.0 (Go-микросервисы).
# Запуск: cd deploy-v2 && make dev/up
#
# Намеренно нестандартные хост-порты (5433/6380/8026/8081-8086), чтобы не
# конфликтовать с текущим `deploy/`-стеком Python-бэка на той же машине.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: gw2v4-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grovework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grovework_local}
      POSTGRES_DB: ${POSTGRES_DB:-grovework_v4}
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C.UTF-8"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=200ms
    volumes:
      # PG18+ кладёт данные в /var/lib/postgresql/18/data, поэтому монтируем
      # родительскую папку — иначе pg_ctlcluster ругается на legacy layout.
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grovework} -d ${POSTGRES_DB:-grovework_v4}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: gw2v4-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gw2v4-mailhog
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # UI

  # ───────── микросервисы ─────────

  auth:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    container_name: gw2v4-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: auth
    ports:
      - "8081:8080"

  users:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: users
    container_name: gw2v4-users
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: users
    ports:
      - "8082:8080"

  tasks:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: tasks
    container_name: gw2v4-tasks
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: tasks
    ports:
      - "8083:8080"

  messenger:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: messenger
    container_name: gw2v4-messenger
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: messenger
    ports:
      - "8084:8080"

  calls:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: calls
    container_name: gw2v4-calls
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: calls
    ports:
      - "8085:8080"

  ai:
    build:
      context: ../back-go
      dockerfile: Dockerfile
      args:
        SERVICE: ai
    container_name: gw2v4-ai
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: ai
    ports:
      - "8086:8080"

volumes:
  postgres_data:
